services:
  postgres:
    image: postgres:16
    container_name: badger_trading_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - badger_trading_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrations:
    image: postgres:16
    container_name: badger_trading_migrations
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    volumes:
      - ./database/migrations:/migrations:ro
      - ./database/run-migrations.sh:/run-migrations.sh:ro
    entrypoint: ["sh", "/run-migrations.sh"]
    restart: "no"

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: badger_trading_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3000}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

      MARKET_DATA_SYNC_ENABLED: ${MARKET_DATA_SYNC_ENABLED:-false}
      MARKET_DATA_SYNC_LIMIT: ${MARKET_DATA_SYNC_LIMIT:-100}
      MARKET_DATA_PROVIDER: ${MARKET_DATA_PROVIDER:-binance}
      COINBASE_REST_BASE_URL: ${COINBASE_REST_BASE_URL:-https://api.exchange.coinbase.com}

      BOT_TRADING_MODE: ${BOT_TRADING_MODE:-paper}
      BOT_TESTNET_QUOTE_ORDER_QTY: ${BOT_TESTNET_QUOTE_ORDER_QTY:-10}

      BOT_AUTO_RUN_ENABLED: ${BOT_AUTO_RUN_ENABLED:-false}
      BOT_AUTO_RUN_INTERVAL_MINUTES: ${BOT_AUTO_RUN_INTERVAL_MINUTES:-15}

      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}

      BINANCE_TRADING_MODE: ${BINANCE_TRADING_MODE:-testnet}
      BINANCE_TESTNET_BASE_URL: ${BINANCE_TESTNET_BASE_URL:-https://testnet.binance.vision/api}
      BINANCE_TESTNET_API_KEY: ${BINANCE_TESTNET_API_KEY:-}
      BINANCE_TESTNET_API_SECRET: ${BINANCE_TESTNET_API_SECRET:-}

      EXCHANGE_RISK_MAX_QUOTE_ORDER_QTY: ${EXCHANGE_RISK_MAX_QUOTE_ORDER_QTY:-10}
      EXCHANGE_RISK_MAX_DAILY_BUY_ORDERS: ${EXCHANGE_RISK_MAX_DAILY_BUY_ORDERS:-5}
      EXCHANGE_RISK_BLOCK_DUPLICATE_OPEN_SYMBOL: ${EXCHANGE_RISK_BLOCK_DUPLICATE_OPEN_SYMBOL:-true}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 5

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    container_name: badger_trading_web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PUBLIC_PORT:-8080}:80"

volumes:
  badger_trading_postgres_data:
